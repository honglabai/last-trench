* {
	box-sizing: border-box;
	-webkit-tap-highlight-color: transparent;
	user-select: none;

}

html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
	width: 100%;
	height: 100%;
}

body {
	color: #ffffff;
	background-color: #000000;
	overflow: hidden;
	touch-action: none;
	font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

#canvas {

/* ==========================================================================
   LANDING VIDEO INTRO & MOBILE OVERLAY
   ========================================================================== */
#landing-overlay {
	position: fixed;
	top: 0;
	left: 0;
	width: 100vw;
	height: 100vh;
	z-index: 10000;
	background-color: #000000;
	overflow: hidden;
	display: flex;
	flex-direction: column;
	justify-content: space-between;
	align-items: center;
	transition: opacity 0.55s cubic-bezier(0.16, 1, 0.3, 1);
}

#landing-overlay.fade-out {
	opacity: 0;
	pointer-events: none;
}

#landing-video {
	position: absolute;
	top: 50%;
	left: 50%;
	min-width: 100%;
	min-height: 100%;
	width: auto;
	height: auto;
	transform: translate(-50%, -50%);
	object-fit: cover;
	z-index: 1;
}

#landing-vignette {
	position: absolute;
	top: 0;
	left: 0;
	width: 100%;
	height: 100%;
	z-index: 2;
	pointer-events: none;
	background:
		radial-gradient(ellipse at center, rgba(0, 0, 0, 0.15) 0%, rgba(0, 0, 0, 0.65) 75%, rgba(0, 0, 0, 0.92) 100%),
		linear-gradient(to bottom, rgba(0, 0, 0, 0.8) 0%, rgba(0, 0, 0, 0) 25%, rgba(0, 0, 0, 0) 65%, rgba(0, 0, 0, 0.9) 100%);
}

#landing-ui {
	position: relative;
	z-index: 3;
	width: 100%;
	height: 100%;
	display: flex;
	flex-direction: column;
	justify-content: space-between;
	align-items: center;
	padding: max(14px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
}

/* TOP BAR */
.landing-top-bar {
	width: 100%;
	display: flex;
	justify-content: space-between;
	align-items: center;
	gap: 12px;
}

.landing-badge {
	display: flex;
	align-items: center;
	gap: 8px;
	background: rgba(0, 20, 30, 0.75);
	border: 1px solid rgba(0, 229, 255, 0.45);
	box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
	border-radius: 4px;
	padding: 6px 12px;
	font-size: 12px;
	font-weight: 700;
	letter-spacing: 0.8px;
	color: #00e5ff;
	backdrop-filter: blur(4px);
}

.pulse-dot {
	width: 8px;
	height: 8px;
	border-radius: 50%;
	background-color: #ff3333;
	box-shadow: 0 0 8px #ff3333;
	animation: pulse 1.2s infinite ease-in-out;
}

@keyframes pulse {
	0%, 100% { opacity: 1; transform: scale(1); }
	50% { opacity: 0.3; transform: scale(0.7); }
}

.landing-top-actions {
	display: flex;
	align-items: center;
	gap: 10px;
}

.btn-tactical-sub {
	background: rgba(12, 18, 24, 0.8);
	border: 1px solid rgba(255, 255, 255, 0.25);
	color: #ffffff;
	border-radius: 4px;
	padding: 8px 14px;
	font-size: 13px;
	font-weight: 700;
	cursor: pointer;
	display: flex;
	align-items: center;
	gap: 6px;
	backdrop-filter: blur(6px);
	transition: all 0.2s ease;
	min-height: 40px;
}

.btn-tactical-sub:hover, .btn-tactical-sub:active {
	background: rgba(0, 229, 255, 0.2);
	border-color: #00e5ff;
	color: #00e5ff;
	box-shadow: 0 0 12px rgba(0, 229, 255, 0.4);
}

/* HERO TITLE */
.landing-hero {
	text-align: center;
	margin-top: auto;
	margin-bottom: auto;
	padding: 0 12px;
	pointer-events: none;
}

.landing-hero-korean {
	font-size: clamp(24px, 5.2vw, 48px);
	font-weight: 900;
	color: #ffffff;
	text-shadow: 0 0 18px rgba(0, 0, 0, 0.9), 0 2px 10px rgba(0, 0, 0, 0.9);
	letter-spacing: 1.5px;
	margin-bottom: 4px;
}

.landing-hero-english {
	font-size: clamp(12px, 2.2vw, 20px);
	font-weight: 800;
	color: #ffaa00;
	letter-spacing: 4px;
	text-shadow: 0 0 12px rgba(255, 170, 0, 0.6), 0 2px 8px rgba(0, 0, 0, 0.9);
}

/* BOTTOM COMMAND PANEL */
.landing-bottom-panel {
	width: 100%;
	max-width: 580px;
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: 10px;
}

.landing-status-row {
	width: 100%;
	display: flex;
	justify-content: space-between;
	align-items: center;
	font-size: 13px;
	font-weight: 700;
	color: #00e5ff;
	text-shadow: 0 0 6px rgba(0, 229, 255, 0.5);
}

.landing-progress-track {
	width: 100%;
	height: 6px;
	background: rgba(255, 255, 255, 0.12);
	border: 1px solid rgba(0, 229, 255, 0.3);
	border-radius: 3px;
	overflow: hidden;
	box-shadow: 0 0 8px rgba(0, 229, 255, 0.2);
}

.landing-progress-bar {
	width: 0%;
	height: 100%;
	background: linear-gradient(90deg, #00b0ff, #00e5ff, #ffaa00);
	border-radius: 3px;
	transition: width 0.15s ease-out;
	box-shadow: 0 0 10px #00e5ff;
}

.btn-deploy-start {
	width: 100%;
	min-height: 54px;
	border: 2px solid rgba(255, 255, 255, 0.3);
	background: rgba(20, 24, 28, 0.85);
	color: #aaaaaa;
	font-size: clamp(16px, 3.5vw, 20px);
	font-weight: 900;
	letter-spacing: 2px;
	border-radius: 6px;
	cursor: not-allowed;
	position: relative;
	overflow: hidden;
	transition: all 0.25s ease;
	backdrop-filter: blur(8px);
	display: flex;
	justify-content: center;
	align-items: center;
}

.btn-deploy-start.ready {
	background: linear-gradient(135deg, rgba(230, 92, 0, 0.95), rgba(255, 140, 0, 0.95));
	border-color: #ffcc00;
	color: #ffffff;
	cursor: pointer;
	box-shadow: 0 0 24px rgba(255, 140, 0, 0.65), inset 0 0 12px rgba(255, 255, 255, 0.3);
	animation: deployPulse 2s infinite ease-in-out;
}

@keyframes deployPulse {
	0%, 100% {
		box-shadow: 0 0 20px rgba(255, 140, 0, 0.6), inset 0 0 10px rgba(255, 255, 255, 0.25);
		transform: scale(1);
	}
	50% {
		box-shadow: 0 0 35px rgba(255, 180, 0, 0.9), inset 0 0 16px rgba(255, 255, 255, 0.5);
		transform: scale(1.015);
	}
}

.btn-deploy-start.ready:active {
	transform: scale(0.98);
}

.landing-footer-notice {
	display: flex;
	gap: 10px;
	font-size: 11px;
	font-weight: 600;
	color: rgba(255, 255, 255, 0.6);
	letter-spacing: 0.5px;
	text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
}

/* ERROR NOTICE */
#landing-error-box {
	display: none;
	background: rgba(120, 20, 30, 0.9);
	border: 1px solid #ff4444;
	border-radius: 6px;
	padding: 12px 18px;
	font-size: 13px;
	color: #ffffff;
	text-align: center;
	max-width: 500px;
	margin: 10px auto;
	box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
}
		</style>
		<script>
function enterFullscreen() {
	var doc = window.document;
	var docEl = doc.documentElement;
	var req = docEl.requestFullscreen || docEl.webkitRequestFullScreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
	if (req && !doc.fullscreenElement && !doc.webkitFullscreenElement) {
		req.call(docEl).then(function() {
			if (screen.orientation && screen.orientation.lock) {
				screen.orientation.lock('landscape').catch(function(){});
			}
		}).catch(function(){});
	}
}
window.addEventListener('pointerdown', function() {
	enterFullscreen();
}, { passive: true });
		</script>

						</button>

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":15392544,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const overlay = document.getElementById('landing-overlay');
	const video = document.getElementById('landing-video');
	const btnSound = document.getElementById('btn-sound');
	const soundIcon = document.getElementById('sound-icon');
	const soundLabel = document.getElementById('sound-label');
	const btnSkip = document.getElementById('btn-skip');
	const btnEnter = document.getElementById('btn-enter');
	const btnEnterText = document.getElementById('btn-enter-text');
	const statusLabel = document.getElementById('landing-status-label');
	const statusPct = document.getElementById('landing-status-pct');
	const progressBar = document.getElementById('landing-progress-bar');
	const errorBox = document.getElementById('landing-error-box');
	const canvas = document.getElementById('canvas');

	let isEngineReady = false;
	let hasExitedLanding = false;
	let pendingUserEnter = false;

	// Sound Toggle
	btnSound.addEventListener('click', function (e) {
		e.stopPropagation();
		if (video.muted) {
			video.muted = false;
			video.volume = 1.0;
			soundIcon.textContent = '🔊';
			soundLabel.textContent = '음향 끄기';
		} else {
			video.muted = true;
			soundIcon.textContent = '🔈';
			soundLabel.textContent = '음향 켜기';
		}
	});

	// Exit landing overlay smoothly
	function enterGame() {
		if (hasExitedLanding) return;
		if (!isEngineReady) {
			pendingUserEnter = true;
			btnEnterText.textContent = '전장 진입 대기 중... (잠시만 기다려주세요)';
			statusLabel.textContent = '엔진 초기화 마무리 중...';
			return;
		}

		hasExitedLanding = true;
		enterFullscreen();

		// Fade out video audio
		if (!video.muted) {
			let vol = video.volume;
			const fadeInterval = setInterval(() => {
				vol = Math.max(0, vol - 0.2);
				video.volume = vol;
				if (vol <= 0) {
					clearInterval(fadeInterval);
					video.pause();
				}
			}, 40);
		} else {
			video.pause();
		}

		overlay.classList.add('fade-out');
		setTimeout(() => {
			overlay.remove();
			canvas.focus();
		}, 550);
	}

	// Button Actions
	btnEnter.addEventListener('click', function (e) {
		e.stopPropagation();
		enterGame();
	});

	btnSkip.addEventListener('click', function (e) {
		e.stopPropagation();
		enterGame();
	});

	// Touching anywhere once game is ready also enters
	overlay.addEventListener('click', function () {
		if (isEngineReady) {
			enterGame();
		}
	});

	function displayFailureNotice(err) {
		console.error(err);
		errorBox.style.display = 'block';
		if (err instanceof Error) {
			errorBox.textContent = '시스템 오류: ' + err.message;
		} else if (typeof err === 'string') {
			errorBox.textContent = '시스템 오류: ' + err;
		} else {
			errorBox.textContent = '알 수 없는 오류가 발생했습니다.';
		}
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => setTimeout(resolve, 2000)),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			displayFailureNotice('브라우저 사양 미달: ' + missing.join(', '));
		}
	} else {
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					const pct = Math.min(100, Math.round((current / total) * 100));
					progressBar.style.width = pct + '%';
					statusPct.textContent = pct + '%';
					statusLabel.textContent = `전장 데이터 다운로드 중... ${pct}%`;
				}
			},
		}).then(() => {
			isEngineReady = true;
			progressBar.style.width = '100%';
			statusPct.textContent = '100%';
			statusLabel.textContent = '작전 준비 완료 (READY)';
			btnEnter.disabled = false;
			btnEnter.classList.add('ready');
			btnEnterText.textContent = '전투 출격 (START OPERATION)';

			if (pendingUserEnter) {
				enterGame();
			}
		}, displayFailureNotice);
	}
}());
