		<style>
* {
	box-sizing: border-box;
	-webkit-tap-highlight-color: transparent;
	user-select: none;
	-webkit-user-select: none;
}

html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
	width: 100%;
	height: 100%;
}

body {
	color: #ffffff;
	background-color: #000000;
	overflow: hidden;
	touch-action: none;
	font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

#canvas {
	display: block;
	width: 100%;
	height: 100%;
}

#canvas:focus {
	outline: none;
}

/* ==========================================================================
   LANDING VIDEO INTRO - MINIMAL TACTICAL OVERLAY
   ========================================================================== */
#landing-overlay {
	position: fixed;
	top: 0;
	left: 0;
	width: 100vw;
	height: 100vh;
	z-index: 10000;
	background-color: #000000;
	overflow: hidden;
	display: flex;
	flex-direction: column;
	justify-content: flex-end;
	align-items: center;
	transition: opacity 0.55s cubic-bezier(0.16, 1, 0.3, 1);
}

#landing-overlay.fade-out {
	opacity: 0;
	pointer-events: none;
}

#landing-video {
	position: absolute;
	top: 50%;
	left: 50%;
	min-width: 100%;
	min-height: 100%;
	width: auto;
	height: auto;
	transform: translate(-50%, -50%);
	object-fit: cover;
	z-index: 1;
}

#landing-vignette {
	position: absolute;
	top: 0;
	left: 0;
	width: 100%;
	height: 100%;
	z-index: 2;
	pointer-events: none;
	background: linear-gradient(to bottom, rgba(0, 0, 0, 0.1) 0%, rgba(0, 0, 0, 0.25) 55%, rgba(0, 0, 0, 0.88) 100%);
}

#landing-ui {
	position: relative;
	z-index: 3;
	width: 100%;
	height: 100%;
	display: flex;
	flex-direction: column;
	justify-content: flex-end;
	align-items: center;
	padding: 0 max(24px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
	pointer-events: none;
}

/* BOTTOM COMMAND PANEL */
.landing-bottom-panel {
	width: 100%;
	max-width: 480px;
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: 12px;
	margin-bottom: 12px;
	pointer-events: auto;
}

.landing-status-row {
	width: 100%;
	display: flex;
	justify-content: center;
	align-items: center;
	font-size: 15px;
	font-weight: 800;
	color: #00e5ff;
	letter-spacing: 1px;
	text-shadow: 0 0 10px rgba(0, 229, 255, 0.7), 0 2px 4px rgba(0, 0, 0, 0.9);
}

.landing-progress-track {
	width: 100%;
	height: 8px;
	background: rgba(255, 255, 255, 0.15);
	border: 1px solid rgba(0, 229, 255, 0.4);
	border-radius: 4px;
	overflow: hidden;
	box-shadow: 0 0 12px rgba(0, 229, 255, 0.35);
}

.landing-progress-bar {
	width: 0%;
	height: 100%;
	background: linear-gradient(90deg, #00b0ff, #00e5ff, #ffaa00);
	border-radius: 4px;
	transition: width 0.15s ease-out;
	box-shadow: 0 0 14px #00e5ff;
}

.btn-deploy-start {
	width: 100%;
	min-height: 58px;
	border: 2px solid rgba(255, 255, 255, 0.25);
	background: rgba(20, 24, 28, 0.85);
	color: #888888;
	font-size: clamp(18px, 4.2vw, 22px);
	font-weight: 900;
	letter-spacing: 2px;
	border-radius: 8px;
	cursor: not-allowed;
	position: relative;
	overflow: hidden;
	transition: all 0.25s ease;
	backdrop-filter: blur(8px);
	display: flex;
	justify-content: center;
	align-items: center;
}

.btn-deploy-start.ready {
	background: linear-gradient(135deg, rgba(230, 92, 0, 0.95), rgba(255, 140, 0, 0.95));
	border-color: #ffcc00;
	color: #ffffff;
	cursor: pointer;
	box-shadow: 0 0 28px rgba(255, 140, 0, 0.75), inset 0 0 12px rgba(255, 255, 255, 0.35);
	animation: deployPulse 2s infinite ease-in-out;
}

@keyframes deployPulse {
	0%, 100% {
		box-shadow: 0 0 20px rgba(255, 140, 0, 0.6), inset 0 0 10px rgba(255, 255, 255, 0.25);
		transform: scale(1);
	}
	50% {
		box-shadow: 0 0 35px rgba(255, 180, 0, 0.9), inset 0 0 16px rgba(255, 255, 255, 0.5);
		transform: scale(1.015);
	}
}

.btn-deploy-start.ready:active {
	transform: scale(0.97);
}

/* ERROR NOTICE */
#landing-error-box {
	display: none;
	background: rgba(120, 20, 30, 0.9);
	border: 1px solid #ff4444;
	border-radius: 6px;
	padding: 12px 18px;
	font-size: 13px;
	color: #ffffff;
	text-align: center;
	max-width: 500px;
	margin: 10px auto;
	box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
}

/* PWA INSTALL & FULLSCREEN HINT */
.btn-pwa-install {
	display: none;
	align-items: center;
	justify-content: center;
	gap: 6px;
	margin: 8px auto 6px auto;
	padding: 7px 16px;
	background: rgba(0, 180, 216, 0.2);
	border: 1px solid #00e5ff;
	border-radius: 18px;
	color: #e0f7fa;
	font-size: 12px;
	font-weight: 600;
	cursor: pointer;
	backdrop-filter: blur(8px);
	box-shadow: 0 0 14px rgba(0, 229, 255, 0.35);
	transition: all 0.2s ease;
}
.btn-pwa-install:active {
	transform: scale(0.96);
	background: rgba(0, 180, 216, 0.45);
}

.landing-tip {
	font-size: 11px;
	color: rgba(255, 255, 255, 0.55);
	margin-top: 6px;
	letter-spacing: 0.3px;
	text-shadow: 0 1px 3px rgba(0,0,0,0.8);
}

		<script>
// PWA Service Worker Registration & Install Prompt Handling
let deferredInstallPrompt = null;
const isStandaloneMode = window.matchMedia('(display-mode: standalone)').matches ||
                         window.matchMedia('(display-mode: fullscreen)').matches ||
                         navigator.standalone === true;

if ('serviceWorker' in navigator) {
	navigator.serviceWorker.register('/sw.js', { scope: '/' }).then(function(reg) {
		console.log('[PWA] Service Worker registered with scope:', reg.scope);
	}).catch(function(err) {
		console.warn('[PWA] Service Worker registration failed:', err);
	});
}

window.addEventListener('beforeinstallprompt', function(e) {
	e.preventDefault();
	deferredInstallPrompt = e;
	var btnPwa = document.getElementById('btn-pwa-install');
	if (btnPwa && !isStandaloneMode) {
		btnPwa.style.display = 'inline-flex';
	}
});

function enterFullscreen() {
	var doc = window.document;
	var docEl = doc.documentElement;
	var req = docEl.requestFullscreen || docEl.webkitRequestFullScreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
	if (req && !doc.fullscreenElement && !doc.webkitFullscreenElement) {
		try {
			var p = req.call(docEl, { navigationUI: 'hide' });
			if (p && p.then) {
				p.then(function() {
					if (screen.orientation && screen.orientation.lock) {
						screen.orientation.lock('landscape').catch(function(){});
					}
				}).catch(function(){});
			}
		} catch (e) {
			req.call(docEl);
		}
	}
}

// Immediately trigger immersive fullscreen on any user touch/tap
['pointerdown', 'touchstart', 'click'].forEach(function(evName) {
	window.addEventListener(evName, function() {
		enterFullscreen();
	}, { passive: true });
});
		</script>
	</head>
	<body>
		<canvas id="canvas">
			귀하의 브라우저는 WebGL 및 HTML5 Canvas를 지원하지 않습니다.

			게임 실행을 위해 브라우저에서 JavaScript를 활성화해주세요.

		<!-- ==================================================================
		     CINEMATIC LANDING VIDEO CONTAINER
		     ================================================================== -->
		<div id="landing-overlay">
			<video id="landing-video" autoplay muted playsinline loop preload="auto" poster="index.png">
				<source src="assets/video/landing_cinematic_mobile.mp4" media="(max-width: 768px)" type="video/mp4">
				<source src="assets/video/landing_cinematic.mp4" type="video/mp4">
			</video>
			<div id="landing-vignette"></div>
			<div id="landing-ui">
				<!-- Bottom Action Panel (Minimal & Clean) -->
				<div class="landing-bottom-panel">
					<div class="landing-status-row">
						<span id="landing-status-label">작전준비 진행율: 0%</span>
					</div>
					<div class="landing-progress-track">
						<div id="landing-progress-bar" class="landing-progress-bar"></div>
					</div>
					<div id="landing-error-box"></div>
					<button id="btn-pwa-install" class="btn-pwa-install" type="button">
						<span>📲 전체화면 정식 앱 설치</span>
					</button>
					<button id="btn-enter" class="btn-deploy-start" type="button" disabled>
						<span id="btn-enter-text">전투 출격</span>
					</button>
					<div class="landing-tip">💡 화면 어디든 터치 시 전체화면으로 자동 전환됩니다</div>
				</div>
			</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":15802780,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const overlay = document.getElementById('landing-overlay');
	const video = document.getElementById('landing-video');
	const btnEnter = document.getElementById('btn-enter');
	const btnEnterText = document.getElementById('btn-enter-text');
	const statusLabel = document.getElementById('landing-status-label');
	const progressBar = document.getElementById('landing-progress-bar');
	const errorBox = document.getElementById('landing-error-box');
	const canvas = document.getElementById('canvas');

	let isEngineReady = false;
	let hasExitedLanding = false;
	let pendingUserEnter = false;

	// Exit landing overlay smoothly
	function enterGame() {
		if (hasExitedLanding) return;
		if (!isEngineReady) {
			pendingUserEnter = true;
			btnEnterText.textContent = '전장 준비 중...';
			return;
		}

		hasExitedLanding = true;
		enterFullscreen();

		if (video) {
			video.pause();
		}

		overlay.classList.add('fade-out');
		setTimeout(() => {
			overlay.remove();
			canvas.focus();
		}, 550);
	}

	// PWA Install Button
	var btnPwa = document.getElementById('btn-pwa-install');
	if (btnPwa) {
		btnPwa.addEventListener('click', async function (e) {
			e.stopPropagation();
			if (deferredInstallPrompt) {
				deferredInstallPrompt.prompt();
				var choice = await deferredInstallPrompt.userChoice;
				console.log('[PWA] User choice outcome:', choice.outcome);
				deferredInstallPrompt = null;
				btnPwa.style.display = 'none';
			}
		});
	}

	// Button Action
	btnEnter.addEventListener('click', function (e) {
		enterFullscreen();
		e.stopPropagation();
		enterGame();
	});
	btnEnter.addEventListener('touchstart', function () {
		enterFullscreen();
	}, { passive: true });

	// If player taps ready overlay, enter game
	overlay.addEventListener('click', function () {
		enterFullscreen();
		if (isEngineReady) {
			enterGame();
		}
	});
	overlay.addEventListener('touchstart', function () {
		enterFullscreen();
	}, { passive: true });

	function displayFailureNotice(err) {
		console.error(err);
		errorBox.style.display = 'block';
		if (err instanceof Error) {
			errorBox.textContent = '시스템 오류: ' + err.message;
		} else if (typeof err === 'string') {
			errorBox.textContent = '시스템 오류: ' + err;
		} else {
			errorBox.textContent = '알 수 없는 오류가 발생했습니다.';
		}
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => setTimeout(resolve, 2000)),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			displayFailureNotice('브라우저 사양 미달: ' + missing.join(', '));
		}
	} else {
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					const pct = Math.min(100, Math.round((current / total) * 100));
					progressBar.style.width = pct + '%';
					statusLabel.textContent = `작전준비 진행율: ${pct}%`;
				}
			},
		}).then(() => {
			isEngineReady = true;
			progressBar.style.width = '100%';
			statusLabel.textContent = '작전준비 완료 (100%)';
			btnEnter.disabled = false;
			btnEnter.classList.add('ready');
			btnEnterText.textContent = '전투 출격';

			if (pendingUserEnter) {
				enterGame();
			}
		}, displayFailureNotice);
	}
}());
		</script>
